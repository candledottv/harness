[install]
exact = true

[test]
# Live tests start real harnesses or need a terminal. A plain `bun test` skips them, and so does
# `bun test <file>` (silently, exit 0). Run them with: bun run test:live <file>
# dist/ is build output, which can hold a whole copy of the repo with its own tests.
pathIgnorePatterns = ["**/*.live.test.ts", "dist/**"]
